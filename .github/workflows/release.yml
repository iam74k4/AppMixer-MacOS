name: release

# main へのマージで、App Store 提出用の .pkg を作り、App Store Connect へ
# アップロードして、そのまま審査に出すところまでを自動で進める。
#
#   upload  … 署名して .pkg を作り、App Store Connect へ送る（macOS ランナー）
#   submit  … 処理の終了を待ち、バージョンにビルドを紐づけ、審査に出す（Linux）
#
# 配信が始まったあとのタグ打ちは tag-release.yml が引き取る。
# 必要な Secrets は docs/release-flow.md にまとめてある。未設定のまま main へ
# マージすると署名の段階で落ちる（プロダクトには影響しない）。

on:
  push:
    branches: [main]
  # Secrets を直した後の再実行や、初回の疎通確認のために手でも回せるようにする。
  workflow_dispatch:
    inputs:
      submit:
        description: "審査に出すところまでやる"
        type: boolean
        default: true

# アップロードを途中で打ち切ると App Store Connect に処理中のビルドが残るため、
# 後続を待たせる（cancel はしない）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_BUNDLE_ID: com.iam74k4.AppMixer

jobs:
  upload:
    runs-on: macos-latest
    # 署名証明書と App Store Connect の API キーは Environment（release）の
    # Secrets に置く。リポジトリ Secrets だと、どのブランチのどのワークフローからも
    # 読めてしまう。Environment 側で配備ブランチを main に限れば、提出に使える鍵は
    # main を通ったコードからしか触れない。
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.pkg.outputs.build }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - uses: actions/checkout@v5
        with:
          # 「この版はもう出したか」をタグの有無で判定するため、履歴とタグが全部要る。
          fetch-depth: 0

      - name: 出す版かどうかを判定
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" bundle/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # タグがある = 配信済みの版。バージョンを上げずに main へマージした
            # （ドキュメント修正など）だけなので、アップロードしない。
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION は配信済み（タグあり）。アップロードをスキップします。"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION をアップロードします。"
          fi

      - name: 署名の準備（証明書とプロファイルを取り込む）
        if: steps.version.outputs.release == 'true'
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROVISION_PROFILE_B64: ${{ secrets.PROVISION_PROFILE_B64 }}
        run: |
          # ランナーのログインキーチェーンを汚さないよう、使い捨てのキーチェーンに入れる。
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          echo "$MAS_CERT_P12"           | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$MAS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in dist installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$KEYCHAIN_PATH" \
              -P "$CERT_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          # これが無いと codesign が鍵に触るたびに GUI の許可を待って止まる。
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "$PROVISION_PROFILE_B64" | base64 --decode > AppMixer.provisionprofile
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/installer.p12

      - name: 提出用 .pkg を作る
        id: pkg
        if: steps.version.outputs.release == 'true'
        env:
          MAS_IDENTITY: ${{ secrets.MAS_IDENTITY }}
          MAS_INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
        run: |
          swift --version
          echo "SDK: $(xcrun --show-sdk-version)"
          make mas \
            MAS_IDENTITY="$MAS_IDENTITY" \
            MAS_INSTALLER_IDENTITY="$MAS_INSTALLER_IDENTITY" \
            PROVISION_PROFILE=AppMixer.provisionprofile
          # ビルド番号は Makefile が導出する。同じ式を書き写すと片方だけずれるので、
          # できあがった .app から読み取って後続へ渡す。
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/mas/AppMixer.app/Contents/Info.plist)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "ビルド番号: $BUILD"

      - name: App Store Connect へアップロード
        if: steps.version.outputs.release == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # altool は API キーをこの決まった場所から探す。
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_API_KEY_ID".p8

          # altool が使えなくなったときの代替は docs/release-flow.md 参照。
          xcrun altool --upload-app \
            -f "dist/AppMixer-$VERSION.pkg" \
            --type macos \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

          echo "アップロード完了。"

      - name: 後片付け（鍵を残さない）
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys AppMixer.provisionprofile

  # ビルドの処理待ちは 10 分から 1 時間かかる。macOS ランナーは課金の倍率が
  # 高いので、Xcode の要らないここは Linux で待つ。
  submit:
    needs: upload
    if: >-
      needs.upload.outputs.release == 'true'
      && vars.ASC_AUTO_SUBMIT != 'false'
      && (github.event_name != 'workflow_dispatch' || inputs.submit)
    runs-on: ubuntu-latest
    # upload と同じ API キーを使う。
    environment: release
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を入れる
        run: pip install --quiet "pyjwt[crypto]"

      - name: ビルドの処理が終わるのを待つ
        id: build
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          BUILD_ID=$(python3 scripts/asc.py wait-build \
            --version "${{ needs.upload.outputs.version }}" \
            --build "${{ needs.upload.outputs.build }}")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: リリースノートを CHANGELOG から取り出す
        run: |
          ./scripts/changelog-section.sh "${{ needs.upload.outputs.version }}" > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "warning: CHANGELOG.md に [${{ needs.upload.outputs.version }}] の節がありません。"
          fi
          cat /tmp/notes.md

      - name: バージョンを用意して審査に出す
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          python3 scripts/asc.py submit \
            --version "${{ needs.upload.outputs.version }}" \
            --build-id "${{ steps.build.outputs.id }}" \
            --notes-file /tmp/notes.md \
            --release-type "${{ vars.ASC_RELEASE_TYPE || 'AFTER_APPROVAL' }}"
          echo "審査に出しました。通れば自動で配信され、tag-release がタグを打ちます。"
